#!/usr/sbin/nft -f

# ==================================================
# Linux Server Hardening Lab
# Firewall Configuration - Router Server
# OS: Debian 13
# Firewall: nftables
# ==================================================

# --------------------------------------------------
# FILTER TABLE
# --------------------------------------------------

table inet filter {

    # Traffic destined for the router itself
    # Current policy: ACCEPT
    chain input {
        type filter hook input priority filter; policy accept;
    }

    # Traffic passing through the router
    # Default policy: DROP
    chain forward {
        type filter hook forward priority filter; policy drop;

        # INT to DMZ: HTTP access
        iifname "ens38" oifname "ens37" ip saddr 10.0.1.0/24 ip daddr 10.0.2.11 tcp dport 80 accept

        # INT to DMZ: SSH access
        iifname "ens38" oifname "ens37" ip saddr 10.0.1.0/24 ip daddr 10.0.2.11 tcp dport 22 accept

        # INT to DMZ: ICMP
        iifname "ens38" oifname "ens37" ip saddr 10.0.1.0/24 ip daddr 10.0.2.11 icmp type echo-request accept

        # DMZ to INT: DNS access
        iifname "ens37" oifname "ens38" ip saddr 10.0.2.0/24 ip daddr 10.0.1.11 tcp dport 53 accept
        iifname "ens37" oifname "ens38" ip saddr 10.0.2.0/24 ip daddr 10.0.1.11 udp dport 53 accept

        # DMZ to INT: ICMP
        iifname "ens37" oifname "ens38" ip saddr 10.0.2.0/24 ip daddr 10.0.1.11 icmp type echo-request accept

        # DMZ to WAN: NTP
        iifname "ens37" oifname "ens33" ip saddr 10.0.2.0/24 udp dport 123 accept

        # INT to WAN: NTP
        iifname "ens38" oifname "ens33" ip saddr 10.0.1.0/24 udp dport 123 accept

        # Allow established and related connections
        ct state established,related accept

        # INT to WAN: HTTP and HTTPS
        iifname "ens38" oifname "ens33" ip saddr 10.0.1.0/24 tcp dport { 80, 443 } accept

        # INT to WAN: DNS
        iifname "ens38" oifname "ens33" ip saddr 10.0.1.0/24 udp dport 53 accept
        iifname "ens38" oifname "ens33" ip saddr 10.0.1.0/24 tcp dport 53 accept

        # DMZ to WAN: HTTP and HTTPS
        iifname "ens37" oifname "ens33" ip saddr 10.0.2.0/24 tcp dport { 80, 443 } accept

        # DMZ to WAN: DNS
        iifname "ens37" oifname "ens33" ip saddr 10.0.2.0/24 udp dport 53 accept
        iifname "ens37" oifname "ens33" ip saddr 10.0.2.0/24 tcp dport 53 accept

        # INT and DMZ: ICMP echo request to WAN
        iifname { "ens37", "ens38" } oifname "ens33" ip protocol icmp icmp type echo-request accept
    }

    # Traffic generated by the router itself
    # Current policy: ACCEPT
    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# --------------------------------------------------
# NAT TABLE
# --------------------------------------------------

table ip nat {

    # Source NAT for internal networks going to WAN
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Masquerade INT and DMZ traffic through WAN
        oifname "ens33" ip saddr 10.0.1.0-10.0.2.255 masquerade
    }
}
